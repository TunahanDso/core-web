name: CORE Telemetry

on:
  push:
    branches: [main]
    paths:
      - "services/core-telemetry/**"
      - ".github/workflows/core-telemetry.yml"
  pull_request:
    paths:
      - "services/core-telemetry/**"
      - ".github/workflows/core-telemetry.yml"

jobs:
  verify-telemetry:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate telemetry Worker bundle
        run: npx wrangler deploy -c services/core-telemetry/wrangler.jsonc --dry-run
      - name: Deploy CORE Telemetry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy -c services/core-telemetry/wrangler.jsonc
