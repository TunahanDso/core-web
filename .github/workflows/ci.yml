name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate D1 seed runner
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("lib/cms/seed.ts", "utf8");
            const forbidden = [
              "PRAGMA foreign_keys = ON",
              "BEGIN TRANSACTION",
              "COMMIT;"
            ];
            for (const token of forbidden) {
              if (source.includes(token)) {
                throw new Error(`Unsupported D1 seed control statement found: ${token}`);
              }
            }
            if (!source.includes("db.batch(")) {
              throw new Error("Showcase seed must execute through D1 batch().");
            }
            if (source.includes("db.exec(")) {
              throw new Error("Showcase seed must not execute through D1 exec().");
            }
            if (source.includes(".split(\\\";\\\")")) {
              throw new Error("Showcase seed must not naively split SQL on semicolons.");
            }
            if (!source.includes("splitSqlStatements")) {
              throw new Error("Showcase seed must use quote-aware SQL statement parsing.");
            }
            console.log("D1 seed runner uses atomic batch() with quote-aware SQL parsing.");

            const portalBootstrap = fs.readFileSync("lib/portal/bootstrap.ts", "utf8");
            if (portalBootstrap.includes("db.exec(PORTAL_SCHEMA_SQL)")) {
              throw new Error("Portal bootstrap must not execute the full schema through D1 exec().");
            }
            if (!portalBootstrap.includes("splitPortalSql")) {
              throw new Error("Portal bootstrap must use quote-aware SQL parsing.");
            }
            if (!portalBootstrap.includes("db.batch(")) {
              throw new Error("Portal bootstrap must execute prepared statements through D1 batch().");
            }
            const portalV4Tables = [
              "portal_invite_deliveries",
              "portal_member_profiles",
              "portal_channel_reads",
              "portal_vault_files",
              "portal_vault_versions",
              "portal_design_derivatives",
              "portal_mail_state",
              "portal_mail_drafts",
              "portal_mail_attachments",
              "portal_native_repositories",
              "portal_repo_gateways",
              "portal_code_runs",
              "portal_mobile_devices"
            ];
            for (const table of portalV4Tables) {
              if (!portalBootstrap.includes(table)) {
                throw new Error(`Portal V4 schema missing required table: ${table}`);
              }
            }
            if (!portalBootstrap.includes("PORTAL_V4_SQL") || !portalBootstrap.includes("PORTAL_V5_SQL")) {
              throw new Error("Portal engineering/mobile migrations must be part of the idempotent bootstrap path.");
            }
            console.log("Portal bootstrap uses prepared D1 batch() and includes V5 native mobile tables.");

            const mailSource = fs.readFileSync("lib/portal/mail.ts", "utf8");
            if (!mailSource.includes("not_configured")) {
              throw new Error("Invitation mail service must fail safely when no provider is configured.");
            }
            const wrangler = fs.readFileSync("wrangler.jsonc", "utf8");
            if (wrangler.includes("RESEND_API_KEY")) {
              throw new Error("RESEND_API_KEY must never be committed to wrangler.jsonc.");
            }
            const wranglerJson = JSON.parse(wrangler);
            const emailBinding = (wranglerJson.send_email ?? []).find((x) => x.name === "EMAIL");
            if (!emailBinding) {
              throw new Error("Cloudflare Email Service binding EMAIL is missing.");
            }
            if (!(emailBinding.allowed_sender_addresses ?? []).includes("portal@ytucore.com")) {
              throw new Error("EMAIL binding must restrict sender identity to portal@ytucore.com.");
            }
            if (!mailSource.includes("sendPortalTestEmail") || !mailSource.includes("replyTo")) {
              throw new Error("Portal mail service must support delivery testing and Reply-To.");
            }
            console.log("Invitation email service has a restricted Cloudflare binding and keeps fallback secrets out of source control.");

            const serviceWorker = fs.readFileSync("public/portal-sw.js", "utf8");
            if (!serviceWorker.includes("url.pathname.startsWith(\"/portal\")") || !serviceWorker.includes("url.pathname.startsWith(\"/api/portal\")")) {
              throw new Error("Portal service worker must explicitly exclude authenticated portal data.");
            }
            if (serviceWorker.includes("caches.put(")) {
              throw new Error("Portal service worker must not cache authenticated application responses.");
            }
            const engineeringServices = fs.readFileSync("lib/portal/engineering-services.ts", "utf8");
            if (engineeringServices.includes("eval(") || engineeringServices.includes("new Function(")) {
              throw new Error("CMS Worker must not execute arbitrary user code.");
            }
            console.log("PWA cache boundary and isolated engineering-service boundary validated.");

            const authSource = fs.readFileSync("lib/portal/auth.ts", "utf8");
            if (!authSource.includes("path: \"/\"")) {
              throw new Error("Portal session cookie must be root-scoped so authenticated /api/portal routes work.");
            }
            if (!authSource.includes("promoteLegacyPortalSessionCookie")) {
              throw new Error("Legacy /portal session cookies need a migration path.");
            }
            const mobileRuntime = fs.readFileSync("components/portal/PortalMobileRuntime.tsx", "utf8");
            if (!mobileRuntime.includes("Capacitor.isNativePlatform()") || !mobileRuntime.includes("appUrlOpen")) {
              throw new Error("Native mobile runtime/deep-link handling is missing.");
            }
            if (!mobileRuntime.includes("core_mobile_handoff_attempted")) {
              throw new Error("Mobile browser handoff must prevent redirect loops.");
            }
            const capacitorConfig = fs.readFileSync("capacitor.config.ts", "utf8");
            if (!capacitorConfig.includes("appId: \"com.ytucore.portal\"") || !capacitorConfig.includes("https://ytucore.com/portal?native=1")) {
              throw new Error("Capacitor production portal shell identity is invalid.");
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.dependencies?.["@capacitor/core"] !== "8.5.2" || pkg.devDependencies?.["@capacitor/cli"] !== "8.5.2") {
              throw new Error("Capacitor toolchain must stay pinned to the reviewed 8.5.2 release.");
            }
            const mobileVars = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")).vars ?? {};
            if (!mobileVars.PORTAL_MOBILE_APP_SCHEME || !mobileVars.PORTAL_ANDROID_PACKAGE || !mobileVars.PORTAL_IOS_BUNDLE_ID) {
              throw new Error("Public mobile application identity is missing from runtime config.");
            }
            console.log("Native mobile shell, session migration and deep-link safety validated.");

            const nativeExperience = fs.readFileSync("components/portal/PortalNativeExperience.tsx", "utf8");
            for (const required of [
              "@capacitor/haptics",
              "@capacitor/network",
              "@capacitor/preferences",
              "@capacitor/keyboard",
              "@capacitor/status-bar",
              "@capacitor/camera",
              "backButton",
              "networkStatusChange",
              "Camera.takePhoto",
              "nativeBottomTabs",
              "nativeSheet"
            ]) {
              if (!nativeExperience.includes(required)) {
                throw new Error(`Native mobile UX missing required capability: ${required}`);
              }
            }
            const mobileUpload = fs.readFileSync("app/api/portal/vault/upload/route.ts", "utf8");
            if (!mobileUpload.includes("getPortalMember") || !mobileUpload.includes("createPortalVaultFile")) {
              throw new Error("Native Vault upload API must authenticate and use the canonical Vault writer.");
            }
            const nativeConfigurator = fs.readFileSync("mobile/scripts/configure-native.mjs", "utf8");
            if (!nativeConfigurator.includes("NSCameraUsageDescription") || !nativeConfigurator.includes("applinks:ytucore.com")) {
              throw new Error("Generated iOS app must include camera privacy text and Universal Link entitlement.");
            }
            const nativePluginVersions = {
              "@capacitor/haptics": "8.0.2",
              "@capacitor/network": "8.0.1",
              "@capacitor/preferences": "8.0.1",
              "@capacitor/keyboard": "8.0.5",
              "@capacitor/status-bar": "8.0.3",
              "@capacitor/camera": "8.2.4"
            };
            for (const [name, version] of Object.entries(nativePluginVersions)) {
              if (pkg.dependencies?.[name] !== version) {
                throw new Error(`${name} must stay pinned to reviewed version ${version}.`);
              }
            }
            for (const required of [
              "nativeSearchSheet",
              "core_recent_routes",
              "core_favorite_routes",
              "nativeTabBadge",
              "counts.notifications",
              "nativeRouteTitle"
            ]) {
              if (!nativeExperience.includes(required)) {
                throw new Error(`Native V7 application shell missing required UX primitive: ${required}`);
              }
            }
            const nativeLayout = fs.readFileSync("app/portal/(member)/layout.tsx", "utf8");
            if (!nativeLayout.includes("getPortalMailboxCounts") || !nativeLayout.includes("listPortalChannelsForMember") || !nativeLayout.includes("counts={{")) {
              throw new Error("Native shell must receive live mail/chat/task/notification counters.");
            }
            const taskPage = fs.readFileSync("app/portal/(member)/tasks/page.tsx", "utf8");
            if (!taskPage.includes("portalNativeTaskList") || !taskPage.includes('id="create-task"')) {
              throw new Error("Tasks must expose the native mobile list and addressable create action.");
            }
            const nativeCss = fs.readFileSync("app/globals.css", "utf8");
            if (!nativeCss.includes("CORE PORTAL V7") || !nativeCss.includes(".nativeSearchSheet") || !nativeCss.includes(".portalNativeTaskList")) {
              throw new Error("Native V7 mobile layout rules are missing.");
            }
            if (mobileVars.PORTAL_MOBILE_APP_VERSION !== "0.2.0") {
              throw new Error("Native application version must be 0.2.0 for the V7 UX release.");
            }
            console.log("Native-first V7 search, badges, favorites, recents and route layouts validated.");

            const portalAuth = fs.readFileSync("lib/portal/auth.ts", "utf8");
            const pbkdf2Match = portalAuth.match(/const PBKDF2_ITERATIONS = (\d+);/);
            if (!pbkdf2Match) {
              throw new Error("Portal auth must declare PBKDF2_ITERATIONS.");
            }
            const pbkdf2Iterations = Number(pbkdf2Match[1]);
            if (pbkdf2Iterations > 100000) {
              throw new Error("Cloudflare Workers rejects PBKDF2 iteration counts above 100000.");
            }
            if (pbkdf2Iterations < 100000) {
              throw new Error("Portal PBKDF2 iteration count must remain at least 100000.");
            }
            console.log("Portal PBKDF2 configuration matches the Cloudflare Workers limit.");
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated runtime config
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const cfg = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            if (!cfg.vars?.POLICY_AUD) throw new Error("POLICY_AUD missing from generated config");
            if (!cfg.vars?.TEAM_DOMAIN) throw new Error("TEAM_DOMAIN missing from generated config");
            if (!cfg.vars?.PORTAL_BASE_URL) throw new Error("PORTAL_BASE_URL missing from generated config");
            if (!cfg.vars?.PORTAL_MAIL_FROM) throw new Error("PORTAL_MAIL_FROM missing from generated config");
            if (!cfg.vars?.PORTAL_MAIL_REPLY_TO) throw new Error("PORTAL_MAIL_REPLY_TO missing from generated config");
            if (!cfg.vars?.PORTAL_MOBILE_APP_SCHEME) throw new Error("PORTAL_MOBILE_APP_SCHEME missing from generated config");
            if (!cfg.vars?.PORTAL_ANDROID_PACKAGE) throw new Error("PORTAL_ANDROID_PACKAGE missing from generated config");
            if (!cfg.vars?.PORTAL_IOS_BUNDLE_ID) throw new Error("PORTAL_IOS_BUNDLE_ID missing from generated config");
            const d1 = (cfg.d1_databases ?? []).some((x) => x.binding === "DB");
            const r2 = (cfg.r2_buckets ?? []).some((x) => x.binding === "MEDIA");
            const email = (cfg.send_email ?? []).some((x) => x.name === "EMAIL");
            if (!d1) throw new Error("DB binding missing from generated config");
            if (!r2) throw new Error("MEDIA binding missing from generated config");
            if (!email) throw new Error("EMAIL send binding missing from generated config");
            console.log("Generated Cloudflare config contains DB, MEDIA, transactional email and mobile application identity.");
          '

      - name: Validate Worker package
        run: npm run deploy -- --dry-run
