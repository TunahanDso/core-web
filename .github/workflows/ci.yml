name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate D1 seed runner
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("lib/cms/seed.ts", "utf8");
            const forbidden = [
              "PRAGMA foreign_keys = ON",
              "BEGIN TRANSACTION",
              "COMMIT;"
            ];
            for (const token of forbidden) {
              if (source.includes(token)) {
                throw new Error(`Unsupported D1 seed control statement found: ${token}`);
              }
            }
            if (!source.includes("db.batch(")) {
              throw new Error("Showcase seed must execute through D1 batch().");
            }
            if (source.includes("db.exec(")) {
              throw new Error("Showcase seed must not execute through D1 exec().");
            }
            if (source.includes(".split(\\\";\\\")")) {
              throw new Error("Showcase seed must not naively split SQL on semicolons.");
            }
            if (!source.includes("splitSqlStatements")) {
              throw new Error("Showcase seed must use quote-aware SQL statement parsing.");
            }
            console.log("D1 seed runner uses atomic batch() with quote-aware SQL parsing.");

            const portalBootstrap = fs.readFileSync("lib/portal/bootstrap.ts", "utf8");
            if (portalBootstrap.includes("db.exec(PORTAL_SCHEMA_SQL)")) {
              throw new Error("Portal bootstrap must not execute the full schema through D1 exec().");
            }
            if (!portalBootstrap.includes("splitPortalSql")) {
              throw new Error("Portal bootstrap must use quote-aware SQL parsing.");
            }
            if (!portalBootstrap.includes("db.batch(")) {
              throw new Error("Portal bootstrap must execute prepared statements through D1 batch().");
            }
            const portalV4Tables = [
              "portal_invite_deliveries",
              "portal_member_profiles",
              "portal_channel_reads",
              "portal_vault_files",
              "portal_vault_versions",
              "portal_design_derivatives",
              "portal_mail_state",
              "portal_mail_drafts",
              "portal_mail_attachments",
              "portal_native_repositories",
              "portal_repo_gateways",
              "portal_code_runs"
            ];
            for (const table of portalV4Tables) {
              if (!portalBootstrap.includes(table)) {
                throw new Error(`Portal V4 schema missing required table: ${table}`);
              }
            }
            if (!portalBootstrap.includes("PORTAL_V4_SQL")) {
              throw new Error("Portal engineering OS migration must be part of the idempotent bootstrap path.");
            }
            console.log("Portal bootstrap uses prepared D1 batch() and includes V4 engineering OS tables.");

            const mailSource = fs.readFileSync("lib/portal/mail.ts", "utf8");
            if (!mailSource.includes("not_configured")) {
              throw new Error("Invitation mail service must fail safely when no provider is configured.");
            }
            const wrangler = fs.readFileSync("wrangler.jsonc", "utf8");
            if (wrangler.includes("RESEND_API_KEY")) {
              throw new Error("RESEND_API_KEY must never be committed to wrangler.jsonc.");
            }
            console.log("Invitation email service keeps provider secrets out of source control.");

            const serviceWorker = fs.readFileSync("public/portal-sw.js", "utf8");
            if (!serviceWorker.includes('url.pathname.startsWith("/portal")') || !serviceWorker.includes('url.pathname.startsWith("/api/portal")')) {
              throw new Error("Portal service worker must explicitly exclude authenticated portal data.");
            }
            if (serviceWorker.includes("caches.put(")) {
              throw new Error("Portal service worker must not cache authenticated application responses.");
            }
            const engineeringServices = fs.readFileSync("lib/portal/engineering-services.ts", "utf8");
            if (engineeringServices.includes("eval(") || engineeringServices.includes("new Function(")) {
              throw new Error("CMS Worker must not execute arbitrary user code.");
            }
            console.log("PWA cache boundary and isolated engineering-service boundary validated.");

            const portalAuth = fs.readFileSync("lib/portal/auth.ts", "utf8");
            const pbkdf2Match = portalAuth.match(/const PBKDF2_ITERATIONS = (\d+);/);
            if (!pbkdf2Match) {
              throw new Error("Portal auth must declare PBKDF2_ITERATIONS.");
            }
            const pbkdf2Iterations = Number(pbkdf2Match[1]);
            if (pbkdf2Iterations > 100000) {
              throw new Error("Cloudflare Workers rejects PBKDF2 iteration counts above 100000.");
            }
            if (pbkdf2Iterations < 100000) {
              throw new Error("Portal PBKDF2 iteration count must remain at least 100000.");
            }
            console.log("Portal PBKDF2 configuration matches the Cloudflare Workers limit.");
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated runtime config
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const cfg = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            if (!cfg.vars?.POLICY_AUD) throw new Error("POLICY_AUD missing from generated config");
            if (!cfg.vars?.TEAM_DOMAIN) throw new Error("TEAM_DOMAIN missing from generated config");
            if (!cfg.vars?.PORTAL_BASE_URL) throw new Error("PORTAL_BASE_URL missing from generated config");
            if (!cfg.vars?.PORTAL_MAIL_FROM) throw new Error("PORTAL_MAIL_FROM missing from generated config");
            const d1 = (cfg.d1_databases ?? []).some((x) => x.binding === "DB");
            const r2 = (cfg.r2_buckets ?? []).some((x) => x.binding === "MEDIA");
            if (!d1) throw new Error("DB binding missing from generated config");
            if (!r2) throw new Error("MEDIA binding missing from generated config");
            console.log("Generated Cloudflare config contains DB, MEDIA, Access config and portal mail metadata.");
          '

      - name: Validate Worker package
        run: npm run deploy -- --dry-run
