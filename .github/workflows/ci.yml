name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate D1 seed runner
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("lib/cms/seed.ts", "utf8");
            const forbidden = [
              "PRAGMA foreign_keys = ON",
              "BEGIN TRANSACTION",
              "COMMIT;"
            ];
            for (const token of forbidden) {
              if (source.includes(token)) {
                throw new Error(`Unsupported D1 seed control statement found: ${token}`);
              }
            }
            if (!source.includes("db.batch(")) {
              throw new Error("Showcase seed must execute through D1 batch().");
            }
            if (source.includes("db.exec(")) {
              throw new Error("Showcase seed must not execute through D1 exec().");
            }
            if (source.includes(".split(\\\";\\\")")) {
              throw new Error("Showcase seed must not naively split SQL on semicolons.");
            }
            if (!source.includes("splitSqlStatements")) {
              throw new Error("Showcase seed must use quote-aware SQL statement parsing.");
            }
            console.log("D1 seed runner uses atomic batch() with quote-aware SQL parsing.");

            const portalBootstrap = fs.readFileSync("lib/portal/bootstrap.ts", "utf8");
            if (portalBootstrap.includes("db.exec(PORTAL_SCHEMA_SQL)")) {
              throw new Error("Portal bootstrap must not execute the full schema through D1 exec().");
            }
            if (!portalBootstrap.includes("splitPortalSql")) {
              throw new Error("Portal bootstrap must use quote-aware SQL parsing.");
            }
            if (!portalBootstrap.includes("db.batch(")) {
              throw new Error("Portal bootstrap must execute prepared statements through D1 batch().");
            }
            const portalV4Tables = [
              "portal_invite_deliveries",
              "portal_member_profiles",
              "portal_channel_reads",
              "portal_vault_files",
              "portal_vault_versions",
              "portal_design_derivatives",
              "portal_mail_state",
              "portal_mail_drafts",
              "portal_mail_attachments",
              "portal_native_repositories",
              "portal_repo_gateways",
              "portal_code_runs",
              "portal_mobile_devices",
              "portal_teams",
              "portal_team_memberships",
              "portal_role_profiles",
              "portal_member_capabilities",
              "portal_project_registry",
              "portal_project_map_edges",
              "portal_vehicle_profiles",
              "portal_repo_reviews",
              "portal_repo_review_threads",
              "portal_repo_review_comments",
              "portal_repo_review_submissions",
              "portal_code_run_execution",
              "portal_code_run_events",
              "portal_code_run_artifacts",
              "portal_code_terminal_sessions",
              "portal_vault_upload_sessions"
            ];
            for (const table of portalV4Tables) {
              if (!portalBootstrap.includes(table)) {
                throw new Error(`Portal V4 schema missing required table: ${table}`);
              }
            }
            if (!portalBootstrap.includes("PORTAL_V4_SQL") || !portalBootstrap.includes("PORTAL_V5_SQL") || !portalBootstrap.includes("PORTAL_V6_SQL") || !portalBootstrap.includes("PORTAL_V7_SQL") || !portalBootstrap.includes("PORTAL_V8_SQL") || !portalBootstrap.includes("PORTAL_V9_SQL") || !portalBootstrap.includes("PORTAL_V10_SQL")) {
              throw new Error("Portal engineering/mobile/control-plane/review/code-lab migrations must be part of the idempotent bootstrap path.");
            }
            const nativeRepoEngine = fs.readFileSync("lib/portal/native-repo-engine.ts", "utf8");
            for (const required of [
              "provisionEmbeddedRepository",
              "commitEmbeddedRepoChanges",
              "createEmbeddedRepoBranch",
              "compareEmbeddedRepo",
              "diffEmbeddedRepo",
              "listEmbeddedRepoManifests",
              "createEmbeddedRepoRelease",
              "env.MEDIA"
            ]) {
              if (!nativeRepoEngine.includes(required)) {
                throw new Error(`Native R2 repository engine missing: ${required}`);
              }
            }
            const repoService = fs.readFileSync("lib/portal/repositories.ts", "utf8");
            if (!repoService.includes("embeddedRepoServiceRead") || repoService.includes("!serviceStatus.url || !repo.service_repository_id")) {
              throw new Error("Repository workspace must support the embedded R2 engine without requiring an external URL.");
            }
            console.log("Portal bootstrap includes RP-02 review tables and the embedded R2 repository engine boundary.");


            const codeLab = fs.readFileSync("lib/portal/code-lab.ts", "utf8");
            const codeLabPage = fs.readFileSync("app/portal/(member)/code-lab/page.tsx", "utf8");
            const runnerWorker = fs.readFileSync("services/core-runner/src/index.js", "utf8");
            const runnerSandbox = fs.readFileSync("services/core-runner/sandbox_server.py", "utf8");
            const runnerConfig = JSON.parse(fs.readFileSync("services/core-runner/wrangler.jsonc", "utf8"));
            const rootConfig = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            for (const required of [
              "portal_code_run_execution",
              "portal_code_run_events",
              "portal_code_run_artifacts",
              "dispatch_token",
              "ensurePortalCodeLabSchema"
            ]) {
              if (!portalBootstrap.includes(required)) throw new Error(`CL-01 bootstrap missing: ${required}`);
            }
            if (!codeLabPage.includes("listAccessibleNativeRepositories") || codeLabPage.includes("listNativeRepositories()")) {
              throw new Error("Code Lab repository selector must enforce member-scoped repository access.");
            }
            for (const required of ["createPortalCodeRun", "cancelPortalCodeRun", "retryPortalCodeRun", "dispatchToken", "createPortalCodeTerminal", "closePortalCodeTerminal"]) {
              if (!codeLab.includes(required)) throw new Error(`Code Lab lifecycle missing: ${required}`);
            }
            if (!runnerWorker.includes("extends Container") || !runnerWorker.includes("extends WorkflowEntrypoint")) {
              throw new Error("CORE Runner must use Cloudflare Container + Workflow isolation.");
            }
            if (!runnerWorker.includes("enableInternet = false") || !runnerSandbox.includes("TASKS = {")) {
              throw new Error("Sandbox must deny runtime internet and resolve commands from a fixed allowlist.");
            }
            const liveTerminal = fs.readFileSync("components/portal/LiveCodeTerminal.tsx", "utf8");
            for (const required of ["WebSocket", "onData", "@xterm/xterm", "@xterm/addon-fit"]) {
              if (!liveTerminal.includes(required)) throw new Error(`CL-02 terminal client missing: ${required}`);
            }
            const terminalServer = fs.readFileSync("services/core-runner/terminal_server.cjs", "utf8");
            const runnerDockerfile = fs.readFileSync("services/core-runner/Dockerfile", "utf8");
            for (const required of ["getTcpPort(8081)", "requiredPorts = [8080, 8081]", "/v1/terminals", "terminalSocket"]) {
              if (!runnerWorker.includes(required)) throw new Error(`CL-02.1 container websocket transport missing: ${required}`);
            }
            for (const required of ["WebSocketServer", "script", "CORE_RUNNER_NETWORK", "coreTerminal", "8081"]) {
              if (!terminalServer.includes(required)) throw new Error(`CL-02.1 terminal server missing: ${required}`);
            }
            if (!runnerDockerfile.includes("EXPOSE 8080 8081") || !runnerDockerfile.includes("terminal_server.cjs")) {
              throw new Error("CL-02.1 Docker image must expose and start the terminal websocket service.");
            }
            if (!runnerSandbox.includes("/prepare-terminal") || !runnerSandbox.includes("prepare_terminal")) {
              throw new Error("CL-02 sandbox must materialize an isolated terminal workspace.");
            }
            if (!(runnerConfig.containers ?? []).length || !(runnerConfig.workflows ?? []).length) {
              throw new Error("CORE Runner Wrangler config must declare both Containers and Workflows.");
            }
            if (rootConfig.vars?.CORE_RUNNER_URL !== "https://core-runner.oyuncunun61.workers.dev") {
              throw new Error("Portal CORE_RUNNER_URL is not pointed at the production runner service.");
            }
            const vaultLibrary = fs.readFileSync("app/portal/(member)/library/page.tsx", "utf8");
            const vaultDetail = fs.readFileSync("app/portal/(member)/library/[id]/page.tsx", "utf8");
            const vaultUploadClient = fs.readFileSync("components/portal/VaultUploadForm.tsx", "utf8");
            const vaultRevisionClient = fs.readFileSync("components/portal/VaultRevisionUploadForm.tsx", "utf8");
            const vaultTransportClient = fs.readFileSync("components/portal/vault-upload-client.ts", "utf8");
            const vaultUploadService = fs.readFileSync("lib/portal/vault-upload.ts", "utf8");
            const vaultInitApi = fs.readFileSync("app/api/portal/vault/uploads/init/route.ts", "utf8");
            const vaultPutApi = fs.readFileSync("app/api/portal/vault/uploads/[sessionId]/route.ts", "utf8");
            const vaultCompleteApi = fs.readFileSync("app/api/portal/vault/uploads/[sessionId]/complete/route.ts", "utf8");
            if (!vaultLibrary.includes("VaultUploadForm") || vaultLibrary.includes("uploadPortalVaultAction")) {
              throw new Error("Vault initial upload must stay off Server Action file bodies.");
            }
            if (!vaultDetail.includes("VaultRevisionUploadForm") || vaultDetail.includes("uploadPortalVaultVersionAction")) {
              throw new Error("Vault revision upload must stay off Server Action file bodies.");
            }
            for (const required of ["executeVaultUpload", "RAW R2 UPLOAD", "25 * 1024 * 1024"]) {
              if (!vaultUploadClient.includes(required)) throw new Error(`Vault raw upload UI missing: ${required}`);
            }
            for (const required of ["executeVaultUpload", "mode:\"revision\"", "25 * 1024 * 1024"]) {
              if (!vaultRevisionClient.includes(required)) throw new Error(`Vault raw revision UI missing: ${required}`);
            }
            for (const required of ["XMLHttpRequest", "xhr.open(\"PUT\"", "xhr.send(file)", "/api/portal/vault/uploads/init", "completeVaultUpload"]) {
              if (!vaultTransportClient.includes(required)) throw new Error(`Vault raw transport missing: ${required}`);
            }
            for (const required of ["portal_vault_upload_sessions", "writeVaultUploadBody", "completeVaultUploadSession", "mediaBucket().put", "request.arrayBuffer()"]) {
              if (!vaultUploadService.includes(required)) throw new Error(`Vault upload session service missing: ${required}`);
            }
            if (!vaultInitApi.includes("createVaultUploadSession") || !vaultPutApi.includes("writeVaultUploadBody") || !vaultCompleteApi.includes("completeVaultUploadSession")) {
              throw new Error("Vault raw upload API lifecycle is incomplete.");
            }
            if (vaultPutApi.includes("formData()")) {
              throw new Error("Raw Vault upload endpoint must never parse multipart form data.");
            }

            console.log("VA-02 session + raw PUT + finalize Vault transport validated.");
            console.log("CL-02.1 Code Lab jobs + direct container WebSocket terminal isolation validated.");

            const mailSource = fs.readFileSync("lib/portal/mail.ts", "utf8");
            if (!mailSource.includes("not_configured")) {
              throw new Error("Invitation mail service must fail safely when no provider is configured.");
            }
            const wrangler = fs.readFileSync("wrangler.jsonc", "utf8");
            if (wrangler.includes("RESEND_API_KEY")) {
              throw new Error("RESEND_API_KEY must never be committed to wrangler.jsonc.");
            }
            const wranglerJson = JSON.parse(wrangler);
            const emailBinding = (wranglerJson.send_email ?? []).find((x) => x.name === "EMAIL");
            if (!emailBinding) {
              throw new Error("Cloudflare Email Service binding EMAIL is missing.");
            }
            if (!(emailBinding.allowed_sender_addresses ?? []).includes("portal@ytucore.com")) {
              throw new Error("EMAIL binding must restrict sender identity to portal@ytucore.com.");
            }
            if (!mailSource.includes("sendPortalTestEmail") || !mailSource.includes("replyTo")) {
              throw new Error("Portal mail service must support delivery testing and Reply-To.");
            }
            console.log("Invitation email service has a restricted Cloudflare binding and keeps fallback secrets out of source control.");

            const serviceWorker = fs.readFileSync("public/portal-sw.js", "utf8");
            if (!serviceWorker.includes("url.pathname.startsWith(\"/portal\")") || !serviceWorker.includes("url.pathname.startsWith(\"/api/portal\")")) {
              throw new Error("Portal service worker must explicitly exclude authenticated portal data.");
            }
            if (serviceWorker.includes("caches.put(")) {
              throw new Error("Portal service worker must not cache authenticated application responses.");
            }
            const engineeringServices = fs.readFileSync("lib/portal/engineering-services.ts", "utf8");
            if (engineeringServices.includes("eval(") || engineeringServices.includes("new Function(")) {
              throw new Error("CMS Worker must not execute arbitrary user code.");
            }
            console.log("PWA cache boundary and isolated engineering-service boundary validated.");

            const authSource = fs.readFileSync("lib/portal/auth.ts", "utf8");
            if (!authSource.includes("path: \"/\"")) {
              throw new Error("Portal session cookie must be root-scoped so authenticated /api/portal routes work.");
            }
            if (!authSource.includes("promoteLegacyPortalSessionCookie")) {
              throw new Error("Legacy /portal session cookies need a migration path.");
            }
            const mobileRuntime = fs.readFileSync("components/portal/PortalMobileRuntime.tsx", "utf8");
            if (!mobileRuntime.includes("Capacitor.isNativePlatform()") || !mobileRuntime.includes("appUrlOpen")) {
              throw new Error("Native mobile runtime/deep-link handling is missing.");
            }
            if (!mobileRuntime.includes("core_mobile_handoff_attempted")) {
              throw new Error("Mobile browser handoff must prevent redirect loops.");
            }
            for (const required of ["PushNotifications", "pushNotificationActionPerformed", "core:push-opt-in", "pushToken"]) {
              if (!mobileRuntime.includes(required)) {
                throw new Error(`Native push runtime missing capability: ${required}`);
              }
            }
            const capacitorConfig = fs.readFileSync("capacitor.config.ts", "utf8");
            if (!capacitorConfig.includes("appId: \"com.ytucore.portal\"") || !capacitorConfig.includes("https://ytucore.com/portal?native=1")) {
              throw new Error("Capacitor production portal shell identity is invalid.");
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.dependencies?.["@capacitor/core"] !== "8.5.2" || pkg.devDependencies?.["@capacitor/cli"] !== "8.5.2") {
              throw new Error("Capacitor toolchain must stay pinned to the reviewed 8.5.2 release.");
            }
            const mobileVars = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")).vars ?? {};
            if (!mobileVars.PORTAL_MOBILE_APP_SCHEME || !mobileVars.PORTAL_ANDROID_PACKAGE || !mobileVars.PORTAL_IOS_BUNDLE_ID) {
              throw new Error("Public mobile application identity is missing from runtime config.");
            }
            console.log("Native mobile shell, session migration and deep-link safety validated.");

            const nativeExperience = fs.readFileSync("components/portal/PortalNativeExperience.tsx", "utf8");
            for (const required of [
              "@capacitor/haptics",
              "@capacitor/network",
              "@capacitor/preferences",
              "@capacitor/keyboard",
              "@capacitor/status-bar",
              "@capacitor/camera",
              "backButton",
              "networkStatusChange",
              "Camera.takePhoto",
              "nativeBottomTabs",
              "nativeSheet"
            ]) {
              if (!nativeExperience.includes(required)) {
                throw new Error(`Native mobile UX missing required capability: ${required}`);
              }
            }
            const mobileUpload = fs.readFileSync("app/api/portal/vault/upload/route.ts", "utf8");
            if (!mobileUpload.includes("getPortalMember") || !mobileUpload.includes("createPortalVaultFile")) {
              throw new Error("Native Vault upload API must authenticate and use the canonical Vault writer.");
            }
            const nativeConfigurator = fs.readFileSync("mobile/scripts/configure-native.mjs", "utf8");
            if (
              !nativeConfigurator.includes("NSCameraUsageDescription") ||
              !nativeConfigurator.includes("applinks:ytucore.com") ||
              !nativeConfigurator.includes("aps-environment") ||
              !nativeConfigurator.includes("capacitorDidRegisterForRemoteNotifications")
            ) {
              throw new Error("Generated iOS app must include camera, Universal Links and APNs native bridge configuration.");
            }
            const nativePluginVersions = {
              "@capacitor/haptics": "8.0.2",
              "@capacitor/network": "8.0.1",
              "@capacitor/preferences": "8.0.1",
              "@capacitor/keyboard": "8.0.5",
              "@capacitor/status-bar": "8.0.3",
              "@capacitor/camera": "8.2.4",
              "@capacitor/push-notifications": "8.1.0",
              "@capacitor/share": "8.0.1"
            };
            for (const [name, version] of Object.entries(nativePluginVersions)) {
              if (pkg.dependencies?.[name] !== version) {
                throw new Error(`${name} must stay pinned to reviewed version ${version}.`);
              }
            }
            for (const required of [
              "nativeSearchSheet",
              "core_recent_routes",
              "core_favorite_routes",
              "nativeTabBadge",
              "counts.notifications",
              "nativeRouteTitle"
            ]) {
              if (!nativeExperience.includes(required)) {
                throw new Error(`Native V7 application shell missing required UX primitive: ${required}`);
              }
            }
            const nativeLayout = fs.readFileSync("app/portal/(member)/layout.tsx", "utf8");
            if (!nativeLayout.includes("getPortalMailboxCounts") || !nativeLayout.includes("listPortalChannelsForMember") || !nativeLayout.includes("counts={{")) {
              throw new Error("Native shell must receive live mail/chat/task/notification counters.");
            }
            const taskPage = fs.readFileSync("app/portal/(member)/tasks/page.tsx", "utf8");
            if (!taskPage.includes("portalNativeTaskList") || !taskPage.includes("id=\"create-task\"")) {
              throw new Error("Tasks must expose the native mobile list and addressable create action.");
            }
            const nativeCss = fs.readFileSync("app/globals.css", "utf8");
            if (!nativeCss.includes("CORE PORTAL V7") || !nativeCss.includes(".nativeSearchSheet") || !nativeCss.includes(".portalNativeTaskList")) {
              throw new Error("Native V7 mobile layout rules are missing.");
            }
            if (mobileVars.PORTAL_MOBILE_APP_VERSION !== "0.3.0") {
              throw new Error("Native application version must be 0.3.0 for the V9 control/native release.");
            }
            if (!nativeExperience.includes("@capacitor/share") || !nativeExperience.includes("core:push-opt-in")) {
              throw new Error("Native 0.3 experience must expose Share Sheet and explicit push opt-in.");
            }
            console.log("Native-first 0.3 search, badges, camera, push, share and route layouts validated.");

            const mailHealth = fs.readFileSync("lib/portal/mail-health.ts", "utf8");
            for (const required of [
              "cf-bounce.ytucore.com",
              "cf-bounce._domainkey.ytucore.com",
              "_dmarc.ytucore.com",
              "include:_spf.mx.cloudflare.net"
            ]) {
              if (!mailHealth.includes(required)) {
                throw new Error(`Mail deliverability health check missing: ${required}`);
              }
            }
            const commandCenter = fs.readFileSync("components/portal/PortalCommandCenter.tsx", "utf8");
            for (const required of [
              "core_command_recents",
              "metaKey",
              "ctrlKey",
              "/portal/search?q=",
              "/portal/tasks#create-task",
              "/portal/library#upload"
            ]) {
              if (!commandCenter.includes(required)) {
                throw new Error(`CORE Command Center missing capability: ${required}`);
              }
            }
            const portalShell = fs.readFileSync("components/portal/PortalShell.tsx", "utf8");
            if (!portalShell.includes("PortalCommandCenter")) {
              throw new Error("Portal shell must expose the global Command Center.");
            }
            const filteredTasksPage = fs.readFileSync("app/portal/(member)/tasks/page.tsx", "utf8");
            for (const required of ["statusFilter", "priorityFilter", "projectFilter", "mine", "portalTaskFilters"]) {
              if (!filteredTasksPage.includes(required)) {
                throw new Error(`Task usability filter missing: ${required}`);
              }
            }
            const notificationPage = fs.readFileSync("app/portal/(member)/notifications/page.tsx", "utf8");
            if (!notificationPage.includes("markAllNotificationsReadAction") || !notificationPage.includes("filter=unread")) {
              throw new Error("Notification center must preserve unread filtering and mark-all-read.");
            }
            const portalDb = fs.readFileSync("lib/portal/db.ts", "utf8");
            if (!portalDb.includes("markAllPortalNotificationsRead")) {
              throw new Error("Notification mark-all persistence helper is missing.");
            }
            console.log("Deliverability diagnostics, Command Center, task filters and notification controls validated.");

            const governance = fs.readFileSync("lib/portal/governance.ts", "utf8");
            for (const required of ["portalMemberCapabilitySet", "canAccessPortalTeam", "canManagePortalTeam", "team.project.manage", "team.vehicle.manage", "portalRoleProfileCapabilities", "portal_role_profiles", "PORTAL_CAPABILITY_OPTIONS"]) {
              if (!governance.includes(required)) {
                throw new Error(`Governance engine missing capability boundary: ${required}`);
              }
            }
            const controlService = fs.readFileSync("lib/portal/control.ts", "utf8");
            for (const required of [
              "createOrUpdatePortalProject",
              "createPortalVehicleControl",
              "upsertPortalTeamMembership",
              "createPortalMapEdge",
              "createOrUpdatePortalTeam",
              "deletePortalTeam",
              "removePortalTeamMembership",
              "updatePortalRoleProfile",
              "updatePortalMemberGlobalRole"
            ]) {
              if (!controlService.includes(required)) {
                throw new Error(`Control service missing: ${required}`);
              }
            }
            const controlCenterService = fs.readFileSync("lib/portal/control-center.ts", "utf8");
            const controlCenterPage = fs.readFileSync("app/portal/(member)/control-center/page.tsx", "utf8");
            const controlCenterClient = fs.readFileSync("components/portal/ControlCenterRegistry.tsx", "utf8");
            const controlCenterActions = fs.readFileSync("app/portal/control-center-actions.ts", "utf8");
            for (const required of ["members","roles","teams","projects","tasks","vehicles","repositories","vault","inventory"]) {
              if (!controlCenterService.includes(`"${required}"`)) throw new Error(`Control Center registry missing entity: ${required}`);
            }
            for (const required of ["listControlCenterRegistry","updateControlCenterEntity","deleteControlCenterEntity"]) {
              if (!controlCenterService.includes(required)) throw new Error(`Control Center service missing: ${required}`);
            }
            if (!controlCenterPage.includes("ControlCenterRegistry") || !controlCenterPage.includes("memberHasPortalCapability")) {
              throw new Error("Control Center page must be role/capability gated.");
            }
            for (const required of ["controlCenterTabs","controlCenterTable","controlCenterInspector","SİL / ARŞİV"]) {
              if (!controlCenterClient.includes(required)) throw new Error(`Control Center UI missing: ${required}`);
            }
            if (!controlCenterActions.includes("updateControlCenterEntityAction") || !controlCenterActions.includes("deleteControlCenterEntityAction")) {
              throw new Error("Control Center write actions are missing.");
            }
            const portalCss = fs.readFileSync("app/globals.css", "utf8");
            if (!portalCss.includes(":where(.portalApp) footer") || !portalCss.includes("CORE PORTAL V12 · CARD RESET")) {
              throw new Error("Portal card footer reset must prevent public footer styles leaking into entity cards.");
            }

            const teamDirectory = fs.readFileSync("app/portal/(member)/teams/page.tsx", "utf8");
            const memberDirectory = fs.readFileSync("app/portal/(member)/members/page.tsx", "utf8");
            const repositoryDirectory = fs.readFileSync("app/portal/(member)/repositories/page.tsx", "utf8");
            const teamDetail = fs.readFileSync("app/portal/(member)/teams/[code]/page.tsx", "utf8");
            const memberDetail = fs.readFileSync("app/portal/(member)/members/[id]/page.tsx", "utf8");
            for (const required of ["createPortalTeamAction", "portalEntityCard"]) {
              if (!teamDirectory.includes(required)) throw new Error(`GV-01 team directory missing: ${required}`);
            }
            for (const required of ["updatePortalRoleProfileAction", "portalRoleStudio", "portalEntityCard"]) {
              if (!memberDirectory.includes(required)) throw new Error(`GV-01 member directory missing: ${required}`);
            }
            if (!repositoryDirectory.includes("portalRepositoryEntityCard") || !repositoryDirectory.includes("R2 SOURCE OF TRUTH")) {
              throw new Error("GV-01 repository directory must use the refined native repository entity card.");
            }
            for (const required of ["updatePortalTeamAction", "deletePortalTeamAction", "removePortalTeamMembershipScopedAction"]) {
              if (!teamDetail.includes(required)) throw new Error(`GV-01 team management surface missing: ${required}`);
            }
            if (!memberDetail.includes("updatePortalMemberGlobalRoleAction")) {
              throw new Error("GV-01 member profile must expose global role management.");
            }
            const teamWorkspace = fs.readFileSync("app/portal/(member)/teams/[code]/page.tsx", "utf8");
            if (!teamWorkspace.includes("canAccessPortalTeam") || !teamWorkspace.includes("notFound()")) {
              throw new Error("Private team workspace must enforce server-side access before rendering.");
            }
            const projectWorkspace = fs.readFileSync("app/portal/(member)/projects/[slug]/page.tsx", "utf8");
            if (!projectWorkspace.includes("visibility") || !projectWorkspace.includes("canAccessPortalTeam") || !projectWorkspace.includes("notFound()")) {
              throw new Error("Internal project workspace must enforce visibility and team access.");
            }
            const projectMap = fs.readFileSync("components/portal/ProjectMappingCanvas.tsx", "utf8");
            if (!projectMap.includes("projectMapViewport") || !projectMap.includes("zoom") || !projectMap.includes("visibleEdges")) {
              throw new Error("Engineering project map must retain interactive pan/zoom/topology behavior.");
            }
            const controlPage = fs.readFileSync("app/portal/(member)/control/page.tsx", "utf8");
            if (!controlPage.includes("CONTROL PLANE") || !controlPage.includes("ARAÇ KOMUTU")) {
              throw new Error("Heavy control page must preserve the metadata-vs-command authority boundary.");
            }
            const codeReader = fs.readFileSync("components/portal/VaultCodeReader.tsx", "utf8");
            for (const required of ["data-line", "matchLines", "gotoLine", "navigator.clipboard"]) {
              if (!codeReader.includes(required)) throw new Error(`Engineering code reader missing: ${required}`);
            }
            const modelViewer = fs.readFileSync("components/portal/VaultModelViewer.tsx", "utf8");
            for (const required of ["parseGlb", "parseGltfText", "triangles", "perspective", "wire"]) {
              if (!modelViewer.includes(required)) throw new Error(`3D engineering viewer missing: ${required}`);
            }
            const pcbViewer = fs.readFileSync("components/portal/KiCadBoardPreview.tsx", "utf8");
            for (const required of ["segmentRe", "viaRe", "selectedNet", "F.Cu", "B.Cu", "response.body?.getReader()", "R2 source okunuyor"]) {
              if (!pcbViewer.includes(required)) throw new Error(`KiCad engineering viewer missing: ${required}`);
            }
            const vaultSourceBrowser = fs.readFileSync("components/portal/VaultSourceBrowser.tsx", "utf8");
            for (const required of ["CHUNK_BYTES", "/source?", "192 KB pencere", "SONRAKİ"]) {
              if (!vaultSourceBrowser.includes(required)) throw new Error(`Large Vault source browser missing: ${required}`);
            }
            const vaultSourceApi = fs.readFileSync("app/api/portal/vault/[id]/source/route.ts", "utf8");
            if (!vaultSourceApi.includes("readPortalVaultTextChunk") || !vaultSourceApi.includes("Cache-Control")) {
              throw new Error("Large Vault source API is incomplete.");
            }
            const vaultSourceService = fs.readFileSync("lib/portal/vault.ts", "utf8");
            if (!vaultSourceService.includes("readPortalVaultTextChunk") || !vaultSourceService.includes("range: { offset, length }")) {
              throw new Error("Vault service must use R2 ranged reads for large source browsing.");
            }
            const vaultDetailSource = fs.readFileSync("app/portal/(member)/library/[id]/page.tsx", "utf8");
            const vaultPcbWorkspace = fs.readFileSync("components/portal/VaultPcbWorkspace.tsx", "utf8");
            if (!vaultDetailSource.includes("VaultPcbWorkspace") || !vaultDetailSource.includes("sizeBytes={Number(file.size_bytes || 0)}")) {
              throw new Error("KiCad Vault detail must use the dedicated large-file PCB workspace.");
            }
            for (const required of ["PCB ÇALIŞMA ALANI", "KAYNAK", "KiCadBoardPreview", "VaultSourceBrowser"]) {
              if (!vaultPcbWorkspace.includes(required)) throw new Error(`PCB workspace contract missing: ${required}`);
            }
            console.log("VA-03 large KiCad streaming viewer and ranged source browser validated.");
            console.log("GV-01 role-driven authorization, team CRUD, entity cards and V9 engineering controls validated.");

            const portalAuth = fs.readFileSync("lib/portal/auth.ts", "utf8");
            const pbkdf2Match = portalAuth.match(/const PBKDF2_ITERATIONS = (\d+);/);
            if (!pbkdf2Match) {
              throw new Error("Portal auth must declare PBKDF2_ITERATIONS.");
            }
            const pbkdf2Iterations = Number(pbkdf2Match[1]);
            if (pbkdf2Iterations > 100000) {
              throw new Error("Cloudflare Workers rejects PBKDF2 iteration counts above 100000.");
            }
            if (pbkdf2Iterations < 100000) {
              throw new Error("Portal PBKDF2 iteration count must remain at least 100000.");
            }
            console.log("Portal PBKDF2 configuration matches the Cloudflare Workers limit.");
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated runtime config
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const cfg = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            if (!cfg.vars?.POLICY_AUD) throw new Error("POLICY_AUD missing from generated config");
            if (!cfg.vars?.TEAM_DOMAIN) throw new Error("TEAM_DOMAIN missing from generated config");
            if (!cfg.vars?.PORTAL_BASE_URL) throw new Error("PORTAL_BASE_URL missing from generated config");
            if (!cfg.vars?.PORTAL_MAIL_FROM) throw new Error("PORTAL_MAIL_FROM missing from generated config");
            if (!cfg.vars?.PORTAL_MAIL_REPLY_TO) throw new Error("PORTAL_MAIL_REPLY_TO missing from generated config");
            if (!cfg.vars?.PORTAL_MOBILE_APP_SCHEME) throw new Error("PORTAL_MOBILE_APP_SCHEME missing from generated config");
            if (!cfg.vars?.PORTAL_ANDROID_PACKAGE) throw new Error("PORTAL_ANDROID_PACKAGE missing from generated config");
            if (!cfg.vars?.PORTAL_IOS_BUNDLE_ID) throw new Error("PORTAL_IOS_BUNDLE_ID missing from generated config");
            const d1 = (cfg.d1_databases ?? []).some((x) => x.binding === "DB");
            const r2 = (cfg.r2_buckets ?? []).some((x) => x.binding === "MEDIA");
            const email = (cfg.send_email ?? []).some((x) => x.name === "EMAIL");
            if (!d1) throw new Error("DB binding missing from generated config");
            if (!r2) throw new Error("MEDIA binding missing from generated config");
            if (!email) throw new Error("EMAIL send binding missing from generated config");
            console.log("Generated Cloudflare config contains DB, MEDIA, transactional email and mobile application identity.");
          '

      - name: Validate Worker package
        run: npm run deploy -- --dry-run
