name: Portal browser UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portal-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
