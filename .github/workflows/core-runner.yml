name: CORE Runner

on:
  push:
    branches: [main]
    paths:
      - "services/core-runner/**"
      - "config/core-runner-tasks.json"
      - "migrations/0008_code_lab.sql"
      - "lib/portal/code-lab.ts"
      - "app/portal/(member)/code-lab/**"
      - "app/api/portal/code-lab/**"
      - "package.json"
      - ".github/workflows/core-runner.yml"
  pull_request:
    paths:
      - "services/core-runner/**"
      - "config/core-runner-tasks.json"
      - "migrations/0008_code_lab.sql"
      - "lib/portal/code-lab.ts"
      - "app/portal/(member)/code-lab/**"
      - "app/api/portal/code-lab/**"
      - "package.json"
      - ".github/workflows/core-runner.yml"

jobs:
  verify-runner:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate runner sources
        run: npm run runner:check

      - name: Build sandbox image
        run: docker build -f services/core-runner/Dockerfile services/core-runner

      - name: Validate runner Worker bundle
        run: npx wrangler deploy -c services/core-runner/wrangler.jsonc --dry-run --containers-rollout=none

      - name: Deploy CORE Runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy -c services/core-runner/wrangler.jsonc
