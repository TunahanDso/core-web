name: Desktop Native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "components/portal/PortalDesktopExperience.tsx"
      - "app/portal/(member)/layout.tsx"
      - "app/portal/(member)/security/page.tsx"
      - "app/api/portal/desktop/**"
      - "app/globals.css"
      - "package.json"
      - ".github/workflows/desktop-native.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "components/portal/PortalDesktopExperience.tsx"
      - "app/portal/(member)/layout.tsx"
      - "app/portal/(member)/security/page.tsx"
      - "app/api/portal/desktop/**"
      - "app/globals.css"
      - "package.json"
      - ".github/workflows/desktop-native.yml"

permissions:
  contents: read

jobs:
  rust-check:
    name: Tauri Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-windows-portable:
    name: Build Windows portable
    needs: rust-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build release executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage portable executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $target = "artifacts/YTU-CORE-Desktop-Windows-x64.exe"
          Copy-Item "src-tauri/target/release/core-desktop.exe" $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YTU-CORE-Desktop-Windows-x64.exe" | Set-Content "artifacts/YTU-CORE-Desktop-Windows-x64.exe.sha256"

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTU-CORE-Desktop-Windows-x64
          path: |
            artifacts/YTU-CORE-Desktop-Windows-x64.exe
            artifacts/YTU-CORE-Desktop-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish-windows-latest:
    name: Publish desktop-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: YTU-CORE-Desktop-Windows-x64
          path: release

      - name: Publish stable latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="desktop-latest"
          EXE="release/YTU-CORE-Desktop-Windows-x64.exe"
          SHA="release/YTU-CORE-Desktop-Windows-x64.exe.sha256"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "YTÜ CORE Desktop — Latest" --notes "Rolling Windows x64 desktop channel. Build: $GITHUB_SHA" --latest=false
          fi

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          gh release upload "$TAG" "$EXE" "$SHA" --clobber
          gh release edit "$TAG" --title "YTÜ CORE Desktop — Latest" --notes "Rolling Windows x64 desktop channel. Build: $GITHUB_SHA"
