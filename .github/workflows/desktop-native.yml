name: Desktop Native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "components/portal/PortalDesktopExperience.tsx"
      - "app/portal/(member)/layout.tsx"
      - "app/portal/(member)/security/page.tsx"
      - "app/api/portal/desktop/**"
      - "app/globals.css"
      - "app/workspace.css"
      - "package.json"
      - ".github/workflows/desktop-native.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "components/portal/PortalDesktopExperience.tsx"
      - "app/portal/(member)/layout.tsx"
      - "app/portal/(member)/security/page.tsx"
      - "app/api/portal/desktop/**"
      - "app/globals.css"
      - "app/workspace.css"
      - "package.json"
      - ".github/workflows/desktop-native.yml"

permissions:
  contents: read

jobs:
  rust-check:
    name: Tauri Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-windows-portable:
    name: Build Windows portable
    needs: rust-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build release executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Validate internal signing secret availability
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Internal desktop signing secrets are missing."
          }
          Write-Host "Internal desktop signing secrets are configured."


      - name: Stage release executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/core-desktop.exe" "artifacts/YTU-CORE-Desktop-Windows-x64.exe"

      - name: Require signing material for stable builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Stable CORE Desktop release blocked: Windows code-signing secrets are not configured."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/core-desktop-signing.pfx",[Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX_BASE64))
          certutil -user -addstore -f Root "public/desktop/trust/YTU-CORE-Internal-Root-CA.cer" | Out-Host
          certutil -user -addstore -f TrustedPublisher "public/desktop/trust/YTU-CORE-Desktop-Code-Signing.cer" | Out-Host
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on Windows runner." }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f "$env:RUNNER_TEMP/core-desktop-signing.pfx" /p "$env:WINDOWS_SIGNING_CERT_PASSWORD" "artifacts/YTU-CORE-Desktop-Windows-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signtool.FullName verify /pa /all "artifacts/YTU-CORE-Desktop-Windows-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed." }
          Remove-Item "$env:RUNNER_TEMP/core-desktop-signing.pfx" -Force

      - name: Create checksum
        shell: pwsh
        run: |
          $target = "artifacts/YTU-CORE-Desktop-Windows-x64.exe"
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YTU-CORE-Desktop-Windows-x64.exe" | Set-Content "artifacts/YTU-CORE-Desktop-Windows-x64.exe.sha256"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'YTU-CORE-Desktop-Windows-x64-UNSIGNED-DEV' || 'YTU-CORE-Desktop-Windows-x64-SIGNED' }}
          path: |
            artifacts/YTU-CORE-Desktop-Windows-x64.exe
            artifacts/YTU-CORE-Desktop-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish-windows-internal:
    name: Publish desktop-internal
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: YTU-CORE-Desktop-Windows-x64-SIGNED
          path: release

      - name: Publish stable latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="desktop-internal"
          EXE="release/YTU-CORE-Desktop-Windows-x64.exe"
          SHA="release/YTU-CORE-Desktop-Windows-x64.exe.sha256"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "YTÜ CORE Desktop — Internal" --notes "Rolling signed internal Windows x64 desktop channel. Build: $GITHUB_SHA" --latest=false
          fi

          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          gh release upload "$TAG" "$EXE" "$SHA" --clobber
          gh release edit "$TAG" --title "YTÜ CORE Desktop — Latest" --notes "Rolling Windows x64 desktop channel. Build: $GITHUB_SHA"
