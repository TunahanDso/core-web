name: CORE Mail
on:
  push:
    branches: [main]
    paths: ["services/core-mail/**",".github/workflows/core-mail.yml"]
  pull_request:
    paths: ["services/core-mail/**",".github/workflows/core-mail.yml"]
jobs:
  verify-mail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx wrangler deploy -c services/core-mail/wrangler.jsonc --dry-run
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy -c services/core-mail/wrangler.jsonc
